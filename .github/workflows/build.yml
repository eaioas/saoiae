name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build IPInfo.app (universal)
        run: UNIVERSAL=1 ./build.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/IPInfo.app build/IPInfo.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IPInfo
          path: build/IPInfo.zip
