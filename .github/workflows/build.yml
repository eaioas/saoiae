name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build MenuHider.app
        run: ./scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent dist/MenuHider.app dist/MenuHider.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MenuHider
          path: dist/MenuHider.zip
